<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pithy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="callback.js" defer></script>
</head>
<body>
    <nav>
        <h1>Pithy</h1>
        <img src="../assets/pithy_logo.png">
    </nav>

    <div class="main">
        <div class="content">
            <form id="reddit-form">
                <label for="reddit-url">Reddit URL:</label>
                <input type="url" id="reddit-url" name="reddit-url" placeholder="Enter a Reddit URL" required pattern="https?://(www\.)?reddit\.com/.*">

                <div id="query-list">
                    <div class="query-item">
                        <label for="query-summary-1">Summary 1:</label>
                        <input type="text" id="query-summary-1" name="query-summaries[]" placeholder="Enter a one-word summary" required>
                        <label for="query-1">Query 1:</label>
                        <input type="text" id="query-1" name="queries[]" placeholder="Enter a query" required>
                    </div>
                </div>
                
                <button type="button" id="add-query-btn">Add Query</button>

                <button type="submit" id="submit-btn" disabled>Submit</button>
            </form>
        </div>

        <div class="hidden pie">
            <h1>Comment Categories</h1>
            <canvas id="pie-chart"></canvas>
            <div id="comments-container"></div>
        </div>
    </div>
</body>
</html>
